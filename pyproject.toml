[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedarv-license-manager-sdk"
version = "1.0.0"
authors = [
  { name="cedar-v Team" },
]
description = "Python SDK for cedar-v License Manager"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "requests",
    "cryptography",
    # Add other dependencies your SDK requires here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/cedar-v/license-manager-sdk-python"
